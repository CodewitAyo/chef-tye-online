name: Supabase Keepalive

# Purpose (CT-INFRA-001): Supabase's free tier auto-pauses a project after
# 7 days with zero API traffic. This workflow performs a trivial read
# against a small, public-readable table every 5 days so the project
# never goes quiet long enough to trigger a pause. This is a stopgap for
# the free tier, not a substitute for upgrading to Supabase Pro, which
# removes the pause behaviour entirely.

on:
  schedule:
    - cron: '0 6 */5 * *'   # 06:00 UTC, every 5th day-of-month
  workflow_dispatch:         # allows manual triggering from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (rewards_catalog read)
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "https://fnopenwjlrrbhrisxrxa.supabase.co/rest/v1/rewards_catalog?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Keepalive ping failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "Keepalive ping succeeded."
        env:
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZub3BlbndqbHJyYmhyaXN4cnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTA5NzYsImV4cCI6MjA5OTcyNjk3Nn0.FX7k8fEd16dWJSm-Na_Sd61TJMgXJAdIoP8sdCNifJw"
